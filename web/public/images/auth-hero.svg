<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e36888" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f2d88f" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#skyGrad)" />

  <!-- String Lights -->
  <path d="M-10,30 Q100,60 200,30 Q300,60 410,30" stroke="#ffd166" stroke-width="2" stroke-dasharray="1,6" />
  <circle cx="50" cy="42" r="5" fill="#ffd166" />
  <circle cx="120" cy="45" r="5" fill="#ffd166" />
  <circle cx="200" cy="30" r="5" fill="#ffd166" />
  <circle cx="280" cy="45" r="5" fill="#ffd166" />
  <circle cx="350" cy="42" r="5" fill="#ffd166" />

  <!-- Hills/Ground -->
  <path d="M-20,240 L-20,180 Q100,160 200,190 T420,170 L420,240 Z" fill="#9dbf9b" />
  <path d="M-20,240 L-20,200 Q150,170 300,210 T420,195 L420,240 Z" fill="#b4b534" opacity="0.6" />

  <!-- Picnic Blanket -->
  <polygon points="120,210 280,210 320,240 80,240" fill="#fff" opacity="0.9" />
  <polygon points="120,210 280,210 320,240 80,240" fill="none" stroke="#e36888" stroke-width="1.5" />

  <!-- Friends sitting around -->
  <!-- Person 1 (Left) -->
  <circle cx="130" cy="180" r="14" fill="#6698cc" />
  <rect x="115" y="194" width="30" height="35" rx="8" fill="#5587ba" />

  <!-- Person 2 (Center) -->
  <circle cx="200" cy="170" r="15" fill="#ffdcc2" />
  <rect x="182" y="185" width="36" height="45" rx="10" fill="#e36888" />

  <!-- Person 3 (Right) -->
  <circle cx="270" cy="175" r="14" fill="#f08c21" />
  <rect x="255" y="189" width="30" height="40" rx="8" fill="#285f90" />

  <!-- Tiny Campfire in center front -->
  <path d="M190,230 L210,230 L200,215 Z" fill="#f08c21" />
  <path d="M195,230 L205,230 L200,220 Z" fill="#ffd166" />
  <line x1="185" y1="232" x2="215" y2="228" stroke="#564245" stroke-width="3" />
  <line x1="190" y1="228" x2="210" y2="232" stroke="#564245" stroke-width="3" />
</svg>
